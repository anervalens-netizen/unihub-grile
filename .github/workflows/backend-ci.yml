name: Backend CI

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grile_test
          POSTGRES_USER: grile
          POSTGRES_PASSWORD: grile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grile -d grile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
      UGRILE_PG_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --quiet --upgrade 'pip==26.2.1'
          python -m pip install --quiet -c requirements.lock -e '.[dev]'
          python -m pip check
          python -m pip freeze --exclude-editable | LC_ALL=C sort > /tmp/resolved.lock
          diff -u requirements.lock /tmp/resolved.lock

      - name: Ruff
        run: ruff check src tests

      - name: Mypy strict
        run: mypy src

      - name: Fresh migration bootstrap
        run: alembic upgrade head

      - name: Alembic metadata drift
        run: alembic check

      - name: M3 performance contract
        run: pytest tests/integration/test_m3_performance.py tests/integration/test_m3_calendar_save_evaluation.py -q -s

      - name: Test
        run: pytest tests -q -m "not performance"
