name: Backend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grile_test
          POSTGRES_USER: grile
          POSTGRES_PASSWORD: grile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grile -d grile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
      UGRILE_PG_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses:
          actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Mypy strict
        run: mypy src

      - name: Fresh migration bootstrap
        run: alembic upgrade head

      - name: Test
        run: pytest tests -q
