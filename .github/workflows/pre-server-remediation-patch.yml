name: Pre-server remediation patch

on:
  push:
    branches:
      - pre-server/audit-remediation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: pre-server/audit-remediation
          fetch-depth: 0

      - name: Apply independently verified audit remediations
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # PSR-001: Pontaj must never silently truncate historical participants.
          replace_once(
              "backend/src/ugrile/services/xlsx_export.py",
              'from sqlalchemy.orm import Session\n\nfrom ..repositories.models import (',
              'from sqlalchemy.orm import Session\n\nfrom ..domain.errors import ValidationError\nfrom ..repositories.models import (',
          )
          replace_once(
              "backend/src/ugrile/services/xlsx_export.py",
              '* Standard two-agent store uses rows 8 and 11 only; the remaining six\n  block-start rows stay present but empty so the contract layout\n  survives any future agent count.\n',
              '* Historical participants use the available block-start rows in deterministic\n  person order, up to all eight blocks. Rendering fails closed above layout\n  capacity; Pontaj never silently truncates a historical participant.\n',
          )
          replace_once(
              "backend/src/ugrile/services/xlsx_export.py",
              '''    # Two-agent store: render at most 2 blocks (rows 8, 11) when agents exist;\n    # the remaining block rows stay present (empty) per the standard layout.\n    ordered_block_rows = list(active_block_rows)\n    if len(ordered_block_rows) > 2 and persons_by_id or not persons_by_id:\n        ordered_block_rows = ordered_block_rows[:2]\n    # Pick the two persons the standard layout uses (V2 first two by code).\n    sorted_person_ids = sorted(\n        persons_by_id.keys(),\n        key=lambda pid: ((persons_by_id[pid].internal_code or ""), pid),\n    )\n    block_persons = sorted_person_ids[: len(ordered_block_rows)]\n''',
              '''    # The standard sheet provides eight 3-row participant blocks. Historical\n    # people are part of payroll truth even after transfer/deactivation, so render\n    # every person supplied by the revision-pinned selector. Never turn overflow\n    # into a plausible but incomplete workbook.\n    ordered_block_rows = list(active_block_rows)\n    sorted_person_ids = sorted(\n        persons_by_id.keys(),\n        key=lambda pid: ((persons_by_id[pid].internal_code or ""), pid),\n    )\n    if len(sorted_person_ids) > len(ordered_block_rows):\n        raise ValidationError(\n            "Pontaj layout capacity exceeded",\n            details={\n                "code": "PONTAJ_LAYOUT_CAPACITY_EXCEEDED",\n                "capacity": len(ordered_block_rows),\n                "participants": len(sorted_person_ids),\n            },\n        )\n    block_persons = sorted_person_ids\n''',
          )

          Path("backend/tests/services/test_pre_server_xlsx_participants.py").write_text(
              '''from __future__ import annotations\n\nimport io\nfrom datetime import date, time\nfrom decimal import Decimal\n\nimport pytest\nfrom openpyxl import Workbook, load_workbook\nfrom sqlalchemy import select\n\nfrom ugrile.domain.errors import ValidationError\nfrom ugrile.repositories.models import Person, PontajProjection, SiteDayAssignment\nfrom ugrile.repositories.months import MonthRepository\nfrom ugrile.services.revisioned_xlsx_export import render_store_export_at_revision\nfrom ugrile.services.xlsx_export import PONTAJ_BLOCK_STARTS, _write_pontaj_tab\n\n\ndef test_revisioned_store_pontaj_renders_third_historical_participant(\n    session, faker_tenant\n) -> None:\n    tenant_id = faker_tenant["tenant_id"]\n    month = MonthRepository(session).get_or_create(tenant_id, 2026, 8)\n    people = list(\n        session.execute(\n            select(Person)\n            .where(\n                Person.tenant_id == tenant_id,\n                Person.id.in_(\n                    [\n                        faker_tenant["person_a_id"],\n                        faker_tenant["person_b_id"],\n                        faker_tenant["person_c_id"],\n                    ]\n                ),\n            )\n            .order_by(Person.internal_code)\n        ).scalars()\n    )\n    assert len(people) == 3\n    # Historical participants remain exportable even when no longer active.\n    people[2].is_active = False\n\n    for index, person in enumerate(people, start=1):\n        business_date = date(2026, 8, index)\n        session.add(\n            SiteDayAssignment(\n                tenant_id=tenant_id,\n                month_id=month.id,\n                store_id=faker_tenant["store_id"],\n                person_id=person.id,\n                business_date=business_date,\n                status="WORKING",\n                working_kind=(\n                    "EXTRA_OTHER"\n                    if person.id == faker_tenant["person_c_id"]\n                    else "NORMAL"\n                ),\n                revision=1,\n                source="PRE_SERVER_TEST",\n            )\n        )\n        session.add(\n            PontajProjection(\n                tenant_id=tenant_id,\n                month_id=month.id,\n                person_id=person.id,\n                business_date=business_date,\n                revision=1,\n                status="WORKING",\n                start_time=time(10, 0),\n                end_time=time(22, 0),\n                pause_minutes=60,\n                hours=Decimal("11.00"),\n            )\n        )\n    session.commit()\n\n    envelope = render_store_export_at_revision(\n        session,\n        tenant_id=tenant_id,\n        month=month,\n        store_id=faker_tenant["store_id"],\n        revision=1,\n    )\n    workbook = load_workbook(io.BytesIO(envelope.bytes_))\n    pontaj = workbook["Pontaj"]\n    assert [pontaj.cell(row=row, column=1).value for row in (8, 11, 14)] == [\n        person.display_name for person in people\n    ]\n    assert pontaj.cell(row=14, column=5).value == "11.00"\n\n\ndef test_pontaj_fails_closed_above_layout_capacity(faker_tenant) -> None:\n    assert len(PONTAJ_BLOCK_STARTS) == 8\n    people = {\n        f"person_capacity_{index}": Person(\n            id=f"person_capacity_{index}",\n            tenant_id=faker_tenant["tenant_id"],\n            internal_code=f"cap{index:02d}",\n            display_name=f"Capacity {index}",\n            home_store_id=faker_tenant["store_id"],\n        )\n        for index in range(9)\n    }\n    workbook = Workbook()\n    sheet = workbook.active\n    assert sheet is not None\n\n    with pytest.raises(ValidationError) as exc_info:\n        _write_pontaj_tab(\n            sheet,\n            pontaj_rows=[],\n            assignments_by_person_day={},\n            persons_by_id=people,\n            month_year=2026,\n            month_month=8,\n        )\n\n    assert exc_info.value.details == {\n        "code": "PONTAJ_LAYOUT_CAPACITY_EXCEEDED",\n        "capacity": 8,\n        "participants": 9,\n    }\n''',
              encoding="utf-8",
          )

          # PSR-002: certify the production-built frontend in server-test mode.
          Path("frontend/vite.config.ts").write_text(
              '''import { defineConfig } from "vite";\nimport react from "@vitejs/plugin-react";\n\nconst apiProxy =\n  (typeof process !== "undefined" && process.env && process.env.UGRILE_API_PROXY) ||\n  "http://127.0.0.1:8080";\n\nconst apiProxyRoutes = {\n  "/api": {\n    target: apiProxy,\n    changeOrigin: true,\n    rewrite: (path: string) => path.replace(/^\\/api/, ""),\n  },\n};\n\nexport default defineConfig({\n  plugins: [react()],\n  server: {\n    host: "127.0.0.1",\n    port: 5173,\n    proxy: apiProxyRoutes,\n  },\n  preview: {\n    host: "127.0.0.1",\n    port: 5174,\n    proxy: apiProxyRoutes,\n  },\n  test: {\n    environment: "jsdom",\n    globals: true,\n    include: ["tests/**/*.test.ts", "tests/**/*.test.tsx"],\n  },\n});\n''',
              encoding="utf-8",
          )
          replace_once(
              "frontend/src/App.tsx",
              '''// Standalone development keeps convenient fixture defaults. Production builds\n// never synthesize an admin/tenant identity; the future Retail host provides\n// identity through the configured provider boundary.\n''',
              '''// Standalone development keeps convenient fixture defaults. A controlled\n// server-test static build may explicitly provide VITE_DEV_IDENTITY/TENANT for\n// synthetic dev-header principals. Production builds never synthesize identity.\n''',
          )
          replace_once(
              ".github/workflows/browser-e2e.yml",
              '      E2E_BASE_URL: http://127.0.0.1:5173\n',
              '      E2E_BASE_URL: http://127.0.0.1:5174\n',
          )
          replace_once(
              ".github/workflows/browser-e2e.yml",
              '''      - name: Fresh PostgreSQL migration bootstrap\n        working-directory: backend\n        run: python -m alembic upgrade head\n\n      - name: Seed realistic browser dataset\n''',
              '''      - name: Build production frontend with explicit server-test identity\n        working-directory: frontend\n        run: pnpm build\n\n      - name: Fresh PostgreSQL migration bootstrap\n        working-directory: backend\n        run: python -m alembic upgrade head\n\n      - name: Seed realistic browser dataset\n''',
          )
          replace_once(
              ".github/workflows/browser-e2e.yml",
              '''      - name: Start local API and frontend\n        run: |\n          (cd backend && python -m ugrile.main > ../backend-e2e.log 2>&1 & echo $! > ../backend-e2e.pid)\n          (cd frontend && pnpm dev --host 127.0.0.1 --port 5173 > ../frontend-e2e.log 2>&1 & echo $! > ../frontend-e2e.pid)\n          for attempt in $(seq 1 45); do\n            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then\n''',
              '''      - name: Start local API and production-built frontend\n        run: |\n          (cd backend && python -m ugrile.main > ../backend-e2e.log 2>&1 & echo $! > ../backend-e2e.pid)\n          (cd frontend && pnpm preview > ../frontend-e2e.log 2>&1 & echo $! > ../frontend-e2e.pid)\n          for attempt in $(seq 1 45); do\n            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:5174/ >/dev/null; then\n''',
          )

          replace_once(
              "Makefile",
              'cd $(FRONTEND) && pnpm install --silent\n',
              'cd $(FRONTEND) && pnpm install --silent --frozen-lockfile\n',
          )

          # PSR-003: repair already-migrated multi-month close chains run-forward.
          Path("backend/migrations/versions/0013_repair_close_chain_partitioning.py").write_text(
              '''"""Repair legacy close-event digest chains per tenant/month.\n\nMigration 0007 backfilled legacy rows in global timestamp order and carried a\nsingle previous digest across month boundaries. Runtime semantics have always\ndefined an independent append-only chain per ``(tenant_id, month_id)``. This\nrun-forward data repair recomputes every existing close event with the correct\npartitioned predecessor.\n\nRevision ID: b7c9d1e3f5a7\nRevises: 9a1c3e5f7b2d\nCreate Date: 2026-08-24 12:20:00.000000\n"""\n\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nfrom collections.abc import Sequence\n\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision: str = "b7c9d1e3f5a7"\ndown_revision: str | None = "9a1c3e5f7b2d"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef _event_digest(\n    *,\n    tenant_id: str,\n    month_id: str,\n    action: str,\n    previous_state: str,\n    new_state: str,\n    revision_before: int,\n    revision_after: int,\n    actor_id: str,\n    reason: str | None,\n    blockers: str,\n    previous_event_digest: str | None,\n) -> str:\n    payload = json.dumps(\n        {\n            "tenant_id": tenant_id,\n            "month_id": month_id,\n            "action": action,\n            "previous_state": previous_state,\n            "new_state": new_state,\n            "revision_before": revision_before,\n            "revision_after": revision_after,\n            "actor_id": actor_id,\n            "reason": reason,\n            "blockers": blockers,\n            "previous_event_digest": previous_event_digest,\n        },\n        sort_keys=True,\n        ensure_ascii=False,\n        separators=(",", ":"),\n    )\n    return hashlib.sha256(payload.encode("utf-8")).hexdigest()\n\n\ndef _repair_close_chains(conn: sa.engine.Connection) -> None:\n    rows = conn.execute(\n        sa.text(\n            "SELECT id, tenant_id, month_id, action, previous_state, new_state, "\n            "revision_before, revision_after, actor_id, reason, blockers "\n            "FROM month_close_events "\n            "ORDER BY tenant_id, month_id, occurred_at, id"\n        )\n    ).mappings()\n    previous_by_chain: dict[tuple[str, str], str] = {}\n    for row in rows:\n        chain_key = (row["tenant_id"], row["month_id"])\n        previous = previous_by_chain.get(chain_key)\n        digest = _event_digest(\n            tenant_id=row["tenant_id"],\n            month_id=row["month_id"],\n            action=row["action"],\n            previous_state=row["previous_state"],\n            new_state=row["new_state"],\n            revision_before=row["revision_before"],\n            revision_after=row["revision_after"],\n            actor_id=row["actor_id"],\n            reason=row["reason"],\n            blockers=row["blockers"],\n            previous_event_digest=previous,\n        )\n        conn.execute(\n            sa.text(\n                "UPDATE month_close_events SET previous_event_digest = :prev, "\n                "event_digest = :digest WHERE id = :event_id"\n            ),\n            {"prev": previous, "digest": digest, "event_id": row["id"]},\n        )\n        previous_by_chain[chain_key] = digest\n\n\ndef upgrade() -> None:\n    _repair_close_chains(op.get_bind())\n\n\ndef downgrade() -> None:\n    # This is a corrective data migration. Recreating the known-bad global\n    # chain would intentionally corrupt audit evidence, so downgrade is a no-op.\n    pass\n''',
              encoding="utf-8",
          )

          Path("backend/tests/integration/test_pre_server_close_chain_migration.py").write_text(
              '''from __future__ import annotations\n\nimport importlib.util\nfrom collections import defaultdict\nfrom datetime import UTC, datetime, timedelta\nfrom pathlib import Path\n\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom ugrile.domain.close import MonthCloseEventRecord, verify_month_close_chain\nfrom ugrile.repositories.models import Month, MonthCloseEvent, Tenant\n\n\ndef _load_repair_migration():\n    path = (\n        Path(__file__).resolve().parents[2]\n        / "migrations"\n        / "versions"\n        / "0013_repair_close_chain_partitioning.py"\n    )\n    spec = importlib.util.spec_from_file_location("repair_close_chain_partitioning", path)\n    assert spec is not None and spec.loader is not None\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_repair_close_chain_partitions_interleaved_months(pg_engine) -> None:\n    tenant_id = "tenant_pre_server_chain"\n    month_a_id = "month_pre_server_2026_07"\n    month_b_id = "month_pre_server_2026_08"\n    base = datetime(2026, 8, 24, 9, 0, tzinfo=UTC)\n\n    with Session(pg_engine) as session:\n        session.add(\n            Tenant(\n                id=tenant_id,\n                name="Pre-server migration test",\n                timezone="Europe/Bucharest",\n            )\n        )\n        session.add_all(\n            [\n                Month(\n                    id=month_a_id,\n                    tenant_id=tenant_id,\n                    year=2026,\n                    month=7,\n                    state="CLOSED",\n                    revision=2,\n                ),\n                Month(\n                    id=month_b_id,\n                    tenant_id=tenant_id,\n                    year=2026,\n                    month=8,\n                    state="CLOSED",\n                    revision=2,\n                ),\n            ]\n        )\n        session.flush()\n        # Deliberately interleave the two month chains and seed bad links,\n        # reproducing the shape that migration 0007 handled incorrectly.\n        session.add_all(\n            [\n                MonthCloseEvent(\n                    tenant_id=tenant_id,\n                    month_id=month_a_id,\n                    action="CLOSE",\n                    previous_state="OPEN",\n                    new_state="CLOSED",\n                    revision_before=0,\n                    revision_after=1,\n                    actor_id="user_a",\n                    reason=None,\n                    blockers="[]",\n                    previous_event_digest="f" * 64,\n                    event_digest="a" * 64,\n                    occurred_at=base,\n                ),\n                MonthCloseEvent(\n                    tenant_id=tenant_id,\n                    month_id=month_b_id,\n                    action="CLOSE",\n                    previous_state="OPEN",\n                    new_state="CLOSED",\n                    revision_before=0,\n                    revision_after=1,\n                    actor_id="user_b",\n                    reason=None,\n                    blockers="[]",\n                    previous_event_digest="a" * 64,\n                    event_digest="b" * 64,\n                    occurred_at=base + timedelta(seconds=1),\n                ),\n                MonthCloseEvent(\n                    tenant_id=tenant_id,\n                    month_id=month_a_id,\n                    action="REOPEN",\n                    previous_state="CLOSED",\n                    new_state="REOPENED",\n                    revision_before=1,\n                    revision_after=2,\n                    actor_id="user_a",\n                    reason="audit repair",\n                    blockers="[]",\n                    previous_event_digest="b" * 64,\n                    event_digest="c" * 64,\n                    occurred_at=base + timedelta(seconds=2),\n                ),\n                MonthCloseEvent(\n                    tenant_id=tenant_id,\n                    month_id=month_b_id,\n                    action="REOPEN",\n                    previous_state="CLOSED",\n                    new_state="REOPENED",\n                    revision_before=1,\n                    revision_after=2,\n                    actor_id="user_b",\n                    reason="audit repair",\n                    blockers="[]",\n                    previous_event_digest="c" * 64,\n                    event_digest="d" * 64,\n                    occurred_at=base + timedelta(seconds=3),\n                ),\n            ]\n        )\n        session.commit()\n\n    migration = _load_repair_migration()\n    with pg_engine.begin() as conn:\n        migration._repair_close_chains(conn)\n\n    with Session(pg_engine) as session:\n        rows = list(\n            session.execute(\n                select(MonthCloseEvent).order_by(\n                    MonthCloseEvent.month_id,\n                    MonthCloseEvent.occurred_at,\n                    MonthCloseEvent.id,\n                )\n            ).scalars()\n        )\n\n    grouped: dict[str, list[MonthCloseEventRecord]] = defaultdict(list)\n    for row in rows:\n        grouped[row.month_id].append(\n            MonthCloseEventRecord(\n                id=row.id,\n                tenant_id=row.tenant_id,\n                month_id=row.month_id,\n                action=row.action,\n                previous_state=row.previous_state,\n                new_state=row.new_state,\n                revision_before=row.revision_before,\n                revision_after=row.revision_after,\n                actor_id=row.actor_id,\n                reason=row.reason,\n                blockers=row.blockers,\n                previous_event_digest=row.previous_event_digest,\n                event_digest=row.event_digest,\n            )\n        )\n\n    assert set(grouped) == {month_a_id, month_b_id}\n    for records in grouped.values():\n        assert records[0].previous_event_digest is None\n        assert verify_month_close_chain(records) == []\n''',
              encoding="utf-8",
          )

          # Operator docs: make the remediation and server-test contract explicit.
          replace_once(
              "docs/operations/server-test-runbook.md",
              'Canonical status/evidence ledger: issue #4.\n',
              'Historical completed program/evidence ledger: issue #4.\nCurrent pre-server remediation/certification ledger: issue #69.\n',
          )
          replace_once(
              "docs/operations/server-test-runbook.md",
              '''The exact candidate SHA is recorded in issue #4 after final exact-head CI and\nSHA-guard merge. This file intentionally uses the placeholder\n`<CANDIDATE_SHA>` rather than attempting to name its own commit.\n''',
              '''The installable candidate SHA is recorded in issue #69 after remediation,\nexact-head CI and merge attestation. Issue #4 preserves the historical M0-M8\ncandidate evidence but is not installation authorization. This file uses the\nplaceholder `<CANDIDATE_SHA>` rather than attempting to name its own commit.\n''',
          )
          replace_once(
              "docs/operations/server-test-runbook.md",
              '''UGRILE_GOOGLE_PROVIDER=fake\nUGRILE_GOOGLE_LIVE_MUTATIONS_ENABLED=false\nUGR_S5_EXPORT_DIR=<bounded writable server-test path>\n''',
              '''UGRILE_GOOGLE_PROVIDER=fake\nUGRILE_GOOGLE_LIVE_MUTATIONS_ENABLED=false\nUGR_S5_EXPORT_DIR=<bounded writable server-test path>\nVITE_DEV_IDENTITY=<synthetic server-test principal id>\nVITE_DEV_TENANT=<synthetic server-test tenant id>\n''',
          )
          replace_once(
              "docs/operations/server-test-runbook.md",
              '''- bind the server test to a restricted network; `dev_headers` is not production\n  authentication;\n- use non-default PostgreSQL credentials;\n''',
              '''- bind the server test to a restricted network; `dev_headers` is not production\n  authentication;\n- `VITE_DEV_IDENTITY` / `VITE_DEV_TENANT` are non-secret synthetic test IDs\n  embedded at frontend build time; set them before `make build` and never use\n  real employee/customer identifiers;\n- the static frontend/reverse proxy must route `/api` to the Grile API; CI\n  certifies this contract against the production-built `dist` via Vite preview;\n- use non-default PostgreSQL credentials;\n''',
          )
          replace_once(
              "docs/operations/server-test-runbook.md",
              '''From the exact detached candidate checkout:\n\n```bash\nmake install\nmake lint\nmake typecheck\nmake test\nmake build\n```\n''',
              '''From the exact detached candidate checkout, set the synthetic server-test\nfrontend identity **before** building because Vite embeds these values at build\ntime:\n\n```bash\nexport VITE_DEV_IDENTITY="<SYNTHETIC_TEST_USER_ID>"\nexport VITE_DEV_TENANT="<SYNTHETIC_TEST_TENANT_ID>"\nmake install\nmake lint\nmake typecheck\nmake test\nmake build\n```\n\nReplace the quoted placeholders with fixture IDs that exist in the dedicated\nserver-test database. `make install` uses the committed pnpm lockfile in frozen\nmode; unexplained dependency drift is a failure.\n''',
          )
          replace_once(
              "docs/operations/server-test-runbook.md",
              '''- repeated same canonical input is deterministic according to the existing\n  serializer contract;\n- managed export storage remains within the configured retention root.\n''',
              '''- repeated same canonical input is deterministic according to the existing\n  serializer contract;\n- a synthetic store with at least three historical participants renders every\n  participant in Pontaj (including an inactive/leaver historical participant);\n- more than eight participants in one Pontaj workbook fails closed with\n  `PONTAJ_LAYOUT_CAPACITY_EXCEEDED` rather than silently truncating;\n- managed export storage remains within the configured retention root.\n''',
          )

          replace_once(
              "docs/operations/xlsx-export-production.md",
              '''4. scoped pontaj-only output contains only the requested store set;\n5. no external-link parts or formula cells are present;\n6. retention deletes expired/overflow operation entries while preserving\n   filesystem boundaries and symlink safety.\n''',
              '''4. scoped pontaj-only output contains only the requested store set;\n5. every selected historical participant is rendered in deterministic Pontaj\n   blocks up to the eight-block layout capacity, including inactive/leaver\n   history; capacity overflow fails closed instead of truncating;\n6. no external-link parts or formula cells are present;\n7. retention deletes expired/overflow operation entries while preserving\n   filesystem boundaries and symlink safety.\n''',
          )

          replace_once(
              "README.md",
              '''**Nu este încă server-test-ready sau production-ready.** Programul curent\nprioritizează autorizarea/scope-ul, siguranța financiară la close, reziliența\nworkerului, maturizarea frontendului, CI/observability, productionizarea\nGoogle/XLSX și contractele de integrare Retail.\n\nStatusul taskurilor nu se deduce din acest README și nici din vechile etichete\n`S1…S7`. Se citește exclusiv din Master Tracker.\n''',
              '''Programul standalone M0-M8 a ajuns la un candidat istoric certificat, dar\nun audit independent pre-server a deschis remedierea #69 înainte de instalare.\nScorul/gate-ul istoric din #4 nu este, singur, autorizație de instalare.\n\nReadiness-ul curent se stabilește din cea mai recentă certificare exact-head;\npentru această fază sursa este issue #69. Etichetele vechi `S1…S7` și trackerul\nînchis #4 rămân numai dovezi istorice. Production și integrarea Retail rămân în\nafara acestei autorizări.\n''',
          )
          PY

      - name: Remove one-shot patch workflow and commit
        run: |
          rm .github/workflows/pre-server-remediation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix(pre-server): remediate audit blockers"
          git push origin HEAD:pre-server/audit-remediation
