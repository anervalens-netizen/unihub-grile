name: Final Hardening PR Prep

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: final-hardening-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'pre-server/final-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pre-server/final-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Apply hardening edits
        run: python .github/scripts/final_hardening_prep_v2.py

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only

      - name: Generate deterministic Python constraints lock
        working-directory: backend
        shell: bash
        run: |
          python -m venv .venv-lock
          .venv-lock/bin/python -m pip install --quiet --upgrade 'pip==26.2.1'
          .venv-lock/bin/pip install --quiet -e '.[dev]'
          .venv-lock/bin/pip freeze --exclude-editable | LC_ALL=C sort > requirements.lock
          test -s requirements.lock
          .venv-lock/bin/pip check
          rm -rf .venv-lock

      - name: Verify generated locks and focused contracts
        shell: bash
        run: |
          python -m venv /tmp/ugrile-lock-check
          /tmp/ugrile-lock-check/bin/python -m pip install --quiet --upgrade 'pip==26.2.1'
          /tmp/ugrile-lock-check/bin/pip install --quiet -c backend/requirements.lock -e 'backend[dev]'
          /tmp/ugrile-lock-check/bin/pip check
          /tmp/ugrile-lock-check/bin/python -m pytest backend/tests/api/test_s5b_export.py -q
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test

      - name: Commit prepared hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md Makefile backend/pyproject.toml backend/requirements.lock backend/src/ugrile/api/s5b.py backend/tests/api/test_s5b_export.py docs/operations/backup-restore-migrations.md docs/operations/server-test-runbook.md frontend/package.json frontend/pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Harden final server-test contracts and dependencies'
          git push origin HEAD:pre-server/final-hardening
