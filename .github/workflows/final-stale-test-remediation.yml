name: Final Stale Test Remediation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: final-stale-test-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'pre-server/final-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: pre-server/final-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install locked backend
        working-directory: backend
        run: |
          python -m pip install --quiet --upgrade 'pip==26.2.1'
          python -m pip install --quiet -c requirements.lock -e '.[dev]'
          python -m pip check

      - name: Apply stale-test remediation
        run: python .github/scripts/remediate_final_stale_tests.py

      - name: Validate focused contracts
        working-directory: backend
        run: |
          ruff check tests/api/test_m2_export_idempotency.py tests/api/test_m2_revision_bound_jobs.py tests/test_m7_operations_contract.py
          pytest tests/api/test_m2_export_idempotency.py tests/api/test_m2_revision_bound_jobs.py tests/test_m7_operations_contract.py -q

      - name: Commit remediation if needed
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- backend/tests/api/test_m2_export_idempotency.py backend/tests/api/test_m2_revision_bound_jobs.py backend/tests/test_m7_operations_contract.py; then
            echo 'No stale-test remediation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/api/test_m2_export_idempotency.py backend/tests/api/test_m2_revision_bound_jobs.py backend/tests/test_m7_operations_contract.py
          git commit -m 'Align tests with hardened export and Alembic contracts'
          git push origin HEAD:pre-server/final-hardening
