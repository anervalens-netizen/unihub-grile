name: Browser E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grile_test
          POSTGRES_USER: grile
          POSTGRES_PASSWORD: grile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grile -d grile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
      UGRILE_PG_URL: postgresql+psycopg://grile:grile@127.0.0.1:5432/grile_test
      UGRILE_API_PROXY: http://127.0.0.1:8080
      VITE_DEV_IDENTITY: user_perf_admin
      VITE_DEV_TENANT: tenant_perf
      E2E_BASE_URL: http://127.0.0.1:5174
      E2E_ARTIFACT_DIR: e2e-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend and browser driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[dev]' playwright==1.55.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build production frontend with explicit server-test identity
        working-directory: frontend
        run: pnpm build

      - name: Fresh PostgreSQL migration bootstrap
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed realistic browser dataset
        working-directory: backend
        run: python -m tests.fixtures.seed_browser_e2e

      - name: Start local API and production-built frontend
        run: |
          (cd backend && python -m ugrile.main > ../backend-e2e.log 2>&1 & echo $! > ../backend-e2e.pid)
          (cd frontend && pnpm preview > ../frontend-e2e.log 2>&1 & echo $! > ../frontend-e2e.pid)
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:5174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Local E2E stack did not become ready" >&2
          cat backend-e2e.log || true
          cat frontend-e2e.log || true
          exit 1

      - name: Run real Chromium E2E
        run: python frontend/e2e/browser_smoke.py

      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "--- backend-e2e.log ---"
          cat backend-e2e.log || true
          echo "--- frontend-e2e.log ---"
          cat frontend-e2e.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
