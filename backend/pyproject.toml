[project]
name = "ugrile-backend"
description = "UniHub Grile backend (foundation, standalone)."
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web layer
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    # Settings / config
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    # Persistence
    "SQLAlchemy==2.0.36",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    # Async worker skeleton
    "structlog==24.4.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-python-dateutil==2.9.0.20241003",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations", ".venv", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a reachable PostgreSQL server (set UGRILE_PG_URL).",
]